<section>
<h2>Day 1: Average effects with many confounders</h2>
<ol>
<li><p>Wijdan asks whether next year's places should go to the highest risk scores. Which quantity should you estimate first?</p><ul><li><b>A.</b> The AUC of the risk score for unemployment at six months</li><li><b>B.</b> The value of top-fifth-by-risk against top-fifth-by-effect, same budget</li><li><b>C.</b> The effect of coaching on the seekers offered it in 2025</li><li><b>D.</b> The average effect of coaching over all seekers</li></ul></li>
<li><p>A colleague's propensity model for the 2026 offers has a cross-fitted AUC of 0.95 and calls it excellent. What do you conclude?</p><ul><li><b>A.</b> The adjustment will be reliable because the model fits well</li><li><b>B.</b> Employment within six months is easy to predict from the logs</li><li><b>C.</b> Decisions are nearly determined by the covariates, so overlap is probably poor</li><li><b>D.</b> Cross-fitting has already solved any extreme-weight problem</li></ul></li>
<li><p>A colleague fits the propensity and outcome models on all 40,000 decisions, then plugs their predictions into the same score. What is the main risk?</p><ul><li><b>A.</b> The fit takes five times longer than with folds</li><li><b>B.</b> The estimate targets the effect on the offered instead of everyone</li><li><b>C.</b> No risk: the orthogonal score makes nuisance errors irrelevant</li><li><b>D.</b> Overfitted predictions shrink the residuals, biasing the estimate and its interval</li></ul></li>
<li><p>On the 2027 extract, without the motivation note, a colleague proposes to switch from gradient boosting to a deep neural network to remove the bias. What do you tell her?</p><ul><li><b>A.</b> Yes: a more flexible model can learn motivation from the other columns</li><li><b>B.</b> No: report the estimate with a sensitivity bound and its robustness value</li><li><b>C.</b> Drop more columns so the model cannot overfit the remaining ones</li><li><b>D.</b> Raise the folds from five to ten to reduce the bias</li></ul></li>
<li><p>Duhaim, head of caseworkers, asks: "Did coaching raise employment for the seekers my caseworkers chose to coach last year?" Which summary answers him?</p><ul><li><b>A.</b> The effect on the seekers who were offered coaching</li><li><b>B.</b> The average effect over every registered seeker</li><li><b>C.</b> The value of the best rule under next year's budget</li><li><b>D.</b> The difference in employment between coached and uncoached seekers</li></ul></li>
<li><p>A vendor shows that Fursa's risk score predicts unemployment at six months with an AUC of 0.85 and proposes giving places to the top fifth by score. What is the main flaw?</p><ul><li><b>A.</b> An AUC of 0.85 is too low for a public decision</li><li><b>B.</b> It ranks need without coaching, not what coaching changes</li><li><b>C.</b> The score was trained on old data and may have drifted</li><li><b>D.</b> Places should be given at random to be fair</li></ul></li>
<li><p>In the logs, disabled seekers in Nijad were offered coaching in under 1% of decisions. A colleague still reports a doubly robust effect for them. What do you say?</p><ul><li><b>A.</b> The doubly robust estimator protects the estimate, so it can stand</li><li><b>B.</b> Trim them out and report the trimmed effect as the effect for all seekers</li><li><b>C.</b> It rests on the outcome model's extrapolation; say so or drop it</li><li><b>D.</b> Increase the number of folds so the group appears in every fold</li></ul></li>
<li><p>Why does double machine learning use a score with residual corrections instead of averaging the difference of two outcome-model predictions?</p><ul><li><b>A.</b> The corrections speed up the fitting of gradient boosting</li><li><b>B.</b> The corrections remove the need for a propensity model</li><li><b>C.</b> The corrections make the estimate unbiased even with a hidden confounder</li><li><b>D.</b> The corrections make the estimate insensitive to small errors in the nuisance models</li></ul></li>
<li><p>On 40,000 logged decisions, regression adjustment with 60 controls gives 13.5 points (12.4 to 14.7) and DoubleML gives 10.8 (9.6 to 12.1). Without knowing the truth, which reasoning should guide the report?</p><ul><li><b>A.</b> DoubleML: flexible nuisances follow nonlinear confounding</li><li><b>B.</b> Report the average of the two as a compromise</li><li><b>C.</b> Report the regression: its interval is narrower</li><li><b>D.</b> Report neither: the two disagree, so the data cannot answer</li></ul></li>
<li><p>On the 2027 extract the DoubleML estimate is 12.8 points with a robustness value of 8.5%. What may you tell the director?</p><ul><li><b>A.</b> Coaching raised employment by 12.8 points, whatever is missing from the data</li><li><b>B.</b> A hidden factor explaining under 8.5% of both cannot erase it</li><li><b>C.</b> There is an 8.5% chance that the effect is zero</li><li><b>D.</b> The bias from the missing column is at most 8.5 points</li></ul></li>
<li><p>Four nuisance learners give DML estimates from 11.0 to 14.2 points. How should the learner for the report be chosen?</p><ul><li><b>A.</b> By the smallest standard error</li><li><b>B.</b> By the estimate closest to what the caseworkers expect</li><li><b>C.</b> By out-of-fold nuisance losses, fixed before the estimates</li><li><b>D.</b> By the median of the four estimates</li></ul></li>
</ol>
</section>
<section>
<h2>Day 2: Who benefits</h2>
<ol>
<li><p>On the logs, regression with 60 controls gives 13.5 points with a narrow interval; cross-fitted DML gives 10.8 points with a wider one. The DML robustness value is 8.5%. What do you report?</p><ul><li><b>A.</b> The regression estimate, because its interval is narrower</li><li><b>B.</b> The average of the two estimates</li><li><b>C.</b> The DML estimate, its interval and its robustness value</li><li><b>D.</b> Nothing: the robustness value shows the effect may be zero</li></ul></li>
<li><p>A colleague's S-learner on the pilot gives nearly the same effect, about 8 points, for every seeker. The trial was 1:1 and large. What is the most likely reason?</p><ul><li><b>A.</b> Coaching truly has the same effect for everyone</li><li><b>B.</b> Confounding in the pilot has flattened the effects</li><li><b>C.</b> The pilot is too small for any learner to find differences</li><li><b>D.</b> Trees seldom split on coaching, so its interactions shrink</li></ul></li>
<li><p>An analyst grows a causal tree on all 3,600 training seekers and estimates each leaf's effect on the same seekers that chose the splits. What goes wrong?</p><ul><li><b>A.</b> Leaf effects are inflated by the noise that chose the splits</li><li><b>B.</b> The splits follow employment levels rather than effects</li><li><b>C.</b> The estimates are confounded by who was coached</li><li><b>D.</b> The fit takes twice as long as it needs to</li></ul></li>
<li><p>On held-out randomised seekers, an estimator's predicted effects range from 5 to 14 points and its best-linear-predictor slope is 3.1 (standard error 0.6). What do you conclude?</p><ul><li><b>A.</b> The estimator has no useful signal</li><li><b>B.</b> It ranks well, but real differences are about three times larger</li><li><b>C.</b> It exaggerates differences between seekers</li><li><b>D.</b> Its average effect is three times too small</li></ul></li>
<li><p>An estimator's Qini curve lies well above the random line at every share. Which claim does that support?</p><ul><li><b>A.</b> Its predicted effects are correct in size</li><li><b>B.</b> It will rank next year's seekers just as well</li><li><b>C.</b> Its top seekers gain more than a random pick would</li><li><b>D.</b> No other ranking could do better at any budget</li></ul></li>
<li><p>In the X-learner on a 1:1 pilot, what is the imputed effect for a coached seeker who found work?</p><ul><li><b>A.</b> 1 minus the coached model's predicted chance for her</li><li><b>B.</b> The difference between the two models' predictions for her</li><li><b>C.</b> The uncoached model's predicted chance minus 1</li><li><b>D.</b> 1 minus the uncoached model's predicted chance for her</li></ul></li>
<li><p>A T-learner fitted with lightly regularised boosting on 1,800 seekers per arm predicts effects from minus 40 to plus 60 points. The true effects range from minus 10 to plus 30. What is the most likely cause?</p><ul><li><b>A.</b> Each arm's model fits its own noise, which the difference adds up</li><li><b>B.</b> Confounding between the arms in the pilot</li><li><b>C.</b> The outcome is binary, so effects cannot be estimated</li><li><b>D.</b> The T-learner always shrinks effects towards zero</li></ul></li>
<li><p>The causal forest ranks distance to the office as the second driver of effect variation. A manager proposes moving coaching closer to remote seekers to raise its effect. What do you say?</p><ul><li><b>A.</b> Agree: the forest shows distance causes smaller effects</li><li><b>B.</b> Disagree: importance describes, a trial of the change would tell</li><li><b>C.</b> Disagree: importance near the top is always an artefact of correlated features</li><li><b>D.</b> Agree, if the forest's importance has a confidence interval above zero</li></ul></li>
<li><p>You want to check whether an effect model trained on the pilot's training split can be trusted. Which check is valid?</p><ul><li><b>A.</b> Compare its predictions with the observed outcomes of the training seekers</li><li><b>B.</b> Compute the correlation between its predictions and the risk score</li><li><b>C.</b> Compare group effects by prediction on held-out randomised seekers</li><li><b>D.</b> Report its R-squared on the held-out outcomes</li></ul></li>
<li><p>On held-out seekers, estimator A has a best-linear-predictor slope of 0.9 (se 0.2) and estimator B a slope of 0.1 (se 0.2). Both have the same mean prediction. Which conclusion holds?</p><ul><li><b>A.</b> A overstates differences by 10%</li><li><b>B.</b> B is better calibrated because its slope is closer to zero</li><li><b>C.</b> Both are equally useful because their averages agree</li><li><b>D.</b> A carries real signal about effect differences; B almost none</li></ul></li>
<li><p>Why do the Qini curves of every ranking end at the same point?</p><ul><li><b>A.</b> At 100% every ranking coaches everyone</li><li><b>B.</b> Because every ranking was trained on the same data</li><li><b>C.</b> Because the curves are normalised to end at 1</li><li><b>D.</b> Because random allocation is the best any ranking can do at full budget</li></ul></li>
<li><p>Switching from ranking by risk to ranking by estimated benefit would move 84% of the places to different seekers and raise the jobs found. What is the data scientist's responsibility here?</p><ul><li><b>A.</b> Recommend the switch: more jobs settle the question</li><li><b>B.</b> Show who gains and loses a place, and leave priority to its owner</li><li><b>C.</b> Recommend keeping the risk score, because changing who gets support is unfair</li><li><b>D.</b> Average the two rankings to split the difference</li></ul></li>
</ol>
</section>
<section>
<h2>Day 3: Evaluating rules before using them</h2>
<ol>
<li><p>An effect model will decide next year's coaching places. Its builder shows a high correlation between predicted effects and observed outcomes on the training seekers. What do you ask for?</p><ul><li><b>A.</b> Nothing more: a high correlation on 3,600 seekers is enough</li><li><b>B.</b> The correlation of its predictions with the risk score</li><li><b>C.</b> Bootstrap intervals for the same training correlation</li><li><b>D.</b> Observed effects by prediction group on held-out randomised seekers</li></ul></li>
<li><p>In an agency's logs, the mean of offered divided by the recorded probability is 1.15, with a standard error of 0.02. What follows?</p><ul><li><b>A.</b> Coaching raised employment by 15%</li><li><b>B.</b> More offers happened than recorded: some probabilities are too low</li><li><b>C.</b> Nothing: weights are noisy and a mean of 1.15 is normal</li><li><b>D.</b> The tool records probabilities that are too high</li></ul></li>
<li><p>You value a rule with the augmented estimator. The recorded probabilities have been checked and are right; the outcome model is poor. What happens?</p><ul><li><b>A.</b> The estimate is biased, because the outcome model is wrong</li><li><b>B.</b> The estimate is right and as precise as with a good model</li><li><b>C.</b> It stays consistent, with a wider interval</li><li><b>D.</b> The estimate equals the IPW value exactly</li></ul></li>
<li><p>The "reach the unreached" rule has an IPW value 1.6 points below current practice, an effective sample size of 58 among the seekers it would coach, and moves by a point when weights are clipped. What do you recommend?</p><ul><li><b>A.</b> Reject the rule: the logs show it adds nothing</li><li><b>B.</b> Report the value clipped at 20 as the estimate</li><li><b>C.</b> Say the logs cannot value it; propose a small pilot</li><li><b>D.</b> Report the augmented value, which does not depend on the weights</li></ul></li>
<li><p>A colleague wants to keep the analyst's best cell but make it credible. Which step does that?</p><ul><li><b>A.</b> Report the p-value to three decimals so readers see it is 0.001</li><li><b>B.</b> Search more cells to show the finding is robust</li><li><b>C.</b> Bootstrap the cell's 36 seekers and report the interval</li><li><b>D.</b> Test the cell on seekers outside the search</li></ul></li>
<li><p>An agency hands you 30,000 logged decisions with the probability its tool recorded for each. Before valuing any rule, what do you check first?</p><ul><li><b>A.</b> That the outcome model fitted on the logs has a high AUC</li><li><b>B.</b> That the recorded probabilities lie between 0.05 and 0.95</li><li><b>C.</b> That offered divided by recorded probability averages to 1, by office</li><li><b>D.</b> That the offer rate equals the target budget</li></ul></li>
<li><p>One office overrode the allocation tool for a year while the tool kept recording its own probabilities. A candidate rule targets seekers in that office's region. What do you do?</p><ul><li><b>A.</b> Use the recorded probabilities: they are the official record</li><li><b>B.</b> Drop the office and value the rule on the other offices only, without comment</li><li><b>C.</b> Clip the office's weights at 20</li><li><b>D.</b> Re-estimate that office's propensities from its covariates and say so in the report</li></ul></li>
<li><p>In inverse propensity valuation of a rule, a seeker whom the logs did not coach but the rule would coach contributes what?</p><ul><li><b>A.</b> Nothing: the logs did not do what the rule would do</li><li><b>B.</b> Her outcome, weighted by one over the probability of coaching</li><li><b>C.</b> Her outcome plus the average effect of coaching</li><li><b>D.</b> Her outcome with weight one</li></ul></li>
<li><p>You value three rules with inverse propensity weighting and with the augmented estimator. The augmented intervals are all narrower. Why?</p><ul><li><b>A.</b> The augmented estimator uses more data</li><li><b>B.</b> The weighted residuals vary less than the weighted outcomes</li><li><b>C.</b> The augmented estimator clips the weights</li><li><b>D.</b> The augmented estimator assumes no confounding and IPW does not</li></ul></li>
<li><p>Two rules have the same estimated value, within 0.1 points: a caseworker rule on months unemployed and a top fifth ranked by a causal forest. Which choice is best defended?</p><ul><li><b>A.</b> The forest: a model that uses more information must be better</li><li><b>B.</b> Either, chosen by coin toss, since they are equal</li><li><b>C.</b> The readable rule, unless a paired interval favours the other</li><li><b>D.</b> Neither, until a larger dataset separates them</li></ul></li>
<li><p>A rule would coach 3,000 seekers. The logs coached 130 of them, and their weights have an effective sample size of 60. What does this mean for the value estimate?</p><ul><li><b>A.</b> It is fine if the logs hold 40,000 decisions in total</li><li><b>B.</b> It is fine, because 130 coached seekers is above the usual minimum of 30</li><li><b>C.</b> It is biased downwards by a factor of 60 over 3,000</li><li><b>D.</b> It rests on the equivalent of about 60 decisions, so it can move a lot with a few of them</li></ul></li>
<li><p>Clipping the weights at 20 moves a rule's value from 55.9% to 54.8%; the next best rule differs by 0.8 points. What do you report?</p><ul><li><b>A.</b> That the logs cannot rank it, with both values and the ESS</li><li><b>B.</b> The unclipped value, since clipping adds bias</li><li><b>C.</b> The average of the two</li><li><b>D.</b> The clipped value, since clipping reduces variance</li></ul></li>
<li><p>An analyst reports that seekers who attended four or more coaching sessions gained 27 points. Which flaw matters most?</p><ul><li><b>A.</b> The subgroup is too small</li><li><b>B.</b> It is defined after the lottery, so it is selected</li><li><b>C.</b> The p-value should be corrected for multiple tests</li><li><b>D.</b> The analyst should have used a causal forest</li></ul></li>
<li><p>A memo picks the largest of 60 subgroup effects, 49.5 points in 36 seekers, estimated on the same data used to search. What is your best estimate of its true effect without new data?</p><ul><li><b>A.</b> 49.5 points, since the p-value is 0.001</li><li><b>B.</b> Zero, because dredged findings are always false</li><li><b>C.</b> Much smaller: noise helped it win the search</li><li><b>D.</b> Exactly the average effect, since all cells are equal</li></ul></li>
<li><p>Of 60 cells, 52 have p above 0.05. The memo says coaching "showed no effect" in them. What is wrong?</p><ul><li><b>A.</b> Nothing: p above 0.05 means no effect</li><li><b>B.</b> Those cells should be merged into one and tested again</li><li><b>C.</b> The threshold should have been 0.10</li><li><b>D.</b> Cells this small rarely detect a real 10-point effect</li></ul></li>
</ol>
</section>
<section>
<h2>Day 4: Choosing and testing a policy</h2>
<ol>
<li><p>A colleague reports a candidate rule's inverse propensity value as 61.2% employed, with a 95% interval. What else must the report show before anyone relies on it?</p><ul><li><b>A.</b> Nothing: the interval already shows the uncertainty</li><li><b>B.</b> Its effective sample size, and how it moves when weights are clipped</li><li><b>C.</b> The outcome model's accuracy on the logs</li><li><b>D.</b> The rule's true value from the generator</li></ul></li>
<li><p>A colleague proposes to learn the allocation tree by predicting employment within six months and offering places to the leaves with the lowest predicted employment. What is wrong?</p><ul><li><b>A.</b> It targets need, not gain: it rebuilds the risk score</li><li><b>B.</b> A depth-two tree is too simple to predict employment well</li><li><b>C.</b> The pilot is too small for prediction</li><li><b>D.</b> Nothing, if the leaves are chosen on held-out data</li></ul></li>
<li><p>A rule offers places to disabled and non-disabled seekers at the same rate. A board member calls it fair to disabled seekers. What do you add?</p><ul><li><b>A.</b> Nothing: equal rates are the definition of fairness</li><li><b>B.</b> The rule should use disability to offer more places</li><li><b>C.</b> Rates show who is offered, not who gains</li><li><b>D.</b> Equal rates show the rule ignores disability, which is discrimination</li></ul></li>
<li><p>The rule finds 20.7 jobs per 100 places against 11.4 for current practice, yet the trial needs about 18,000 seekers per arm. Why?</p><ul><li><b>A.</b> The per-place gain is too small to detect</li><li><b>B.</b> The arms mostly agree, so across everyone the difference is 1.4 points</li><li><b>C.</b> The interim look doubles the sample size</li><li><b>D.</b> Offices are clustered, so the design effect inflates the sample</li></ul></li>
<li><p>You are writing the "What it is worth" section. Which sentence is right for it?</p><ul><li><b>A.</b> The policy's doubly robust value proves a CATE-driven uplift of 1.4 points</li><li><b>B.</b> The rule will employ 58.9% of seekers</li><li><b>C.</b> The rule guarantees more jobs than current practice</li><li><b>D.</b> On past records, about 14 more per 1,000 in work than today (6 to 22)</li></ul></li>
<li><p>Without a cost per place, an exhaustive depth-two tree offers coaching to 55% of seekers; the budget allows 20%. What do you change?</p><ul><li><b>A.</b> Raise the cost per place until it offers at most 20%</li><li><b>B.</b> Prune the tree to depth one</li><li><b>C.</b> Keep the tree and offer places to the first 20% who register</li><li><b>D.</b> Lower the threshold of every split by 20%</li></ul></li>
<li><p>Treat-all has the highest value on the logs, 65.0% employed against the rule's 58.9%. A board member asks why not recommend it. What is the best answer?</p><ul><li><b>A.</b> Treat-all is biased on the logs</li><li><b>B.</b> It needs five times the places; per place it does worse</li><li><b>C.</b> Treat-all harms some seekers</li><li><b>D.</b> Treat-all cannot be audited by region</li></ul></li>
<li><p>An agency stores each seeker's number of dependants, collected to calculate family benefits. A colleague wants the coaching rule to use it. Which role fits best, and why?</p><ul><li><b>A.</b> Drive: it predicts who benefits</li><li><b>B.</b> Audit: every result should be checked by number of dependants</li><li><b>C.</b> Exclude: collected for another purpose</li><li><b>D.</b> Drive, as long as it is transformed into a score</li></ul></li>
<li><p>A benefit ranking never uses region, yet offers one remote region 7% of its seekers against 23% in another. What explains this?</p><ul><li><b>A.</b> A coding error, since region was not in the model</li><li><b>B.</b> The region was over-represented in the pilot</li><li><b>C.</b> Random noise in the forest</li><li><b>D.</b> Attributes that differ by region act as proxies</li></ul></li>
<li><p>A regional floor changes the rule's value by -0.2 points, with a paired 95% interval from -0.5 to 0.1. How do you report it?</p><ul><li><b>A.</b> Its cost is not distinguishable from zero</li><li><b>B.</b> The floor costs 0.2 points</li><li><b>C.</b> The floor is free</li><li><b>D.</b> The floor improves the rule</li></ul></li>
<li><p>A rule and current practice disagree on 25% of seekers, and among them the rule is expected to raise employment by 6 points. What difference must a trial randomising all seekers detect?</p><ul><li><b>A.</b> 6 points</li><li><b>B.</b> About 1.5 points</li><li><b>C.</b> 24 points</li><li><b>D.</b> It cannot be computed without the trial</li></ul></li>
<li><p>An agency has 12 offices and wants to randomise whole offices so caseworkers never mix the two policies. Employment rates differ between offices (ICC about 0.04). What do you advise?</p><ul><li><b>A.</b> Randomise offices: mixing is the bigger risk</li><li><b>B.</b> Randomise offices, and add more seekers to compensate</li><li><b>C.</b> Randomise seekers within offices and check compliance</li><li><b>D.</b> Skip randomisation and compare offices before and after</li></ul></li>
<li><p>Why does a trial with one interim look use O'Brien–Fleming boundaries instead of testing at 1.96 both times?</p><ul><li><b>A.</b> Regulators require exactly two looks</li><li><b>B.</b> O'Brien–Fleming boundaries make the trial smaller</li><li><b>C.</b> The interim data are less accurate</li><li><b>D.</b> Two tests at 1.96 push false positives above 5%</li></ul></li>
<li><p>A seeker-level trial finds the rule raises employment by 1.5 points. A labour economist says the true gain to the region could be smaller. Why?</p><ul><li><b>A.</b> Coached seekers may take jobs others would have found</li><li><b>B.</b> Seekers in the rule arm may have been more motivated</li><li><b>C.</b> The trial used intention to treat</li><li><b>D.</b> The interim look biased the estimate</li></ul></li>
<li><p>A rule offers places to seekers unemployed 11 to 15 months. Which group should go to caseworker review first?</p><ul><li><b>A.</b> Seekers unemployed 13 months</li><li><b>B.</b> Seekers at 10 or 16 months, and doubtful records</li><li><b>C.</b> All seekers the rule offers</li><li><b>D.</b> Seekers with the highest risk scores</li></ul></li>
</ol>
</section>
