fits","sessions":[{"n":1,"label":"Session 1","title":"Meta-learners"},{"n":2,"label":"Session 2","title":"Causal forests"},{"n":3,"label":"Session 3","title":"Validating effects"},{"n":4,"label":"Session 4","title":"Uplift for targeting"}]},{"n":3,"id":"day3","label":"Day 3","title":"Evaluating rules before using them","sessions":[{"n":1,"label":"Session 1","title":"Logged decisions"},{"n":2,"label":"Session 2","title":"Weighted and augmented estimators"},{"n":3,"label":"Session 3","title":"Untrustworthy estimates"},{"n":4,"label":"Session 4","title":"Reviewing an effects claim"}]},{"n":4,"id":"day4","label":"Day 4","title":"Choosing and testing a policy","sessions":[{"n":1,"label":"Session 1","title":"Policy learning under a budget"},{"n":2,"label":"Session 2","title":"Fair allocation"},{"n":3,"label":"Session 3","title":"The confirmatory trial"},{"n":4,"label":"Session 4","title":"Explaining a rule"}]},{"n":5,"id":"capstone","label":"Capstone","title":"Capstone: a policy evaluation and its defence","sessions":[]}]},"ai":{"context":{"course":"context/course.md","courseJs":"context/course.js","day":null,"llms":"llms.txt"},"tasks":[],"tools":[]},"features":{},"strings":{},"questions":[{"id":"check-q3-estimand-q1","type":"single","prompt":"Wijdan asks whether next year's places should go to the highest risk scores. Which quantity should you estimate first?","options":[{"key":"A","text":"The AUC of the risk score for unemployment at six months"},{"key":"B","text":"The value of top-fifth-by-risk against top-fifth-by-effect, same budget"},{"key":"C","text":"The effect of coaching on the seekers offered it in 2025"},{"key":"D","text":"The average effect of coaching over all seekers"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Q3 compares two rules under the same budget, so its estimand is a difference in policy values. The score's accuracy and the average effect describe other things.","misconceptions":["Treats predicting the outcome as predicting the effect: the score's accuracy is about Y(0)","","Answers Q1 about past offers, not a choice between two future rules","Ignores the budget: treat-all is not one of the options"],"lo":["LO4"],"day":1,"session":1,"slide":{"deck":"day1","id":"check-q3-estimand","title":"Which estimand answers the director's third question?"},"level":null,"pool":"checkpoint"},{"id":"check-overlap-q1","type":"single","prompt":"A colleague's propensity model for the 2026 offers has a cross-fitted AUC of 0.95 and calls it excellent. What do you conclude?","options":[{"key":"A","text":"The adjustment will be reliable because the model fits well"},{"key":"B","text":"Employment within six months is easy to predict from the logs"},{"key":"C","text":"Decisions are nearly determined by the covariates, so overlap is probably poor"},{"key":"D","text":"Cross-fitting has already solved any extreme-weight problem"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A propensity model that separates the arms well means similar seekers rarely received different decisions. That is the definition of poor overlap.","misconceptions":["Carries the logic of outcome prediction over to propensity: a sharp score is a warning here","Confuses a model of the offer with a model of employment","","Believes cross-fitting removes extreme scores; it only removes in-sample overfitting"],"lo":["LO3"],"day":1,"session":2,"slide":{"deck":"day1","id":"check-overlap","title":"What does a propensity AUC of 0.95 tell you?"},"level":null,"pool":"checkpoint"},{"id":"check-crossfitting-q1","type":"single","prompt":"A colleague fits the propensity and outcome models on all 40,000 decisions, then plugs their predictions into the same score. What is the main risk?","options":[{"key":"A","text":"The fit takes five times longer than with folds"},{"key":"B","text":"The estimate targets the effect on the offered instead of everyone"},{"key":"C","text":"No risk: the orthogonal score makes nuisance errors irrelevant"},{"key":"D","text":"Overfitted predictions shrink the residuals, biasing the estimate and its interval"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A flexible model that has seen a decision predicts it too well. Its residual in the score is too small, which biases the estimate and makes the interval too narrow.","misconceptions":["Treats cross-fitting as a speed trick; it costs more fits, not fewer","Believes folding changes the estimand; it changes only how predictions are made","Thinks the orthogonal score alone protects against overfitting; it protects against small errors, not fitted noise",""],"lo":["LO1"],"day":1,"session":3,"slide":{"deck":"day1","id":"check-crossfitting","title":"Why fold the data before fitting the nuisance models?"},"level":null,"pool":"checkpoint"},{"id":"check-hidden-confounder-q1","type":"single","prompt":"On the 2027 extract, without the motivation note, a colleague proposes to switch from gradient boosting to a deep neural network to remove the bias. What do you tell her?","options":[{"key":"A","text":"Yes: a more flexible model can learn motivation from the other columns"},{"key":"B","text":"No: report the estimate with a sensitivity bound and its robustness value"},{"key":"C","text":"Drop more columns so the model cannot overfit the remaining ones"},{"key":"D","text":"Raise the folds from five to ten to reduce the bias"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Bias from an omitted confounder comes from information absent from the data. Only a sensitivity analysis, a new column or a randomised comparison addresses it.","misconceptions":["Believes model capacity can recreate an omitted variable","","Thinks dropping covariates is a remedy; it adds confounding","Confuses sampling noise with bias: more folds narrow nothing that is missing"],"lo":["LO1"],"day":1,"session":4,"slide":{"deck":"day1","id":"check-hidden-confounder","title":"Can a better learner fix the 2027 extract?"},"level":null,"pool":"checkpoint"},{"id":"review-day-1-q1","type":"single","prompt":"On the logs, regression with 60 controls gives 13.5 points with a narrow interval; cross-fitted DML gives 10.8 points with a wider one. The DML robustness value is 8.5%. What do you report?","options":[{"key":"A","text":"The regression estimate, because its interval is narrower"},{"key":"B","text":"The average of the two estimates"},{"key":"C","text":"The DML estimate, its interval and its robustness value"},{"key":"D","text":"Nothing: the robustness value shows the effect may be zero"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"DML allows the nonlinear confounding the regression cannot follow, and the robustness value tells the director how strong a hidden factor would have to be.","misconceptions":["Treats a narrow interval as evidence that the model is right","Averages a biased and an unbiased estimator, keeping half the bias","","Reads a sensitivity analysis as a test that the effect is zero"],"lo":["LO1"],"day":2,"session":null,"slide":{"deck":"day2","id":"review-day-1","title":"Which number goes to the director for Q1?"},"level":null,"pool":"checkpoint"},{"id":"check-meta-learners-q1","type":"single","prompt":"A colleague's S-learner on the pilot gives nearly the same effect, about 8 points, for every seeker. The trial was 1:1 and large. What is the most likely reason?","options":[{"key":"A","text":"Coaching truly has the same effect for everyone"},{"key":"B","text":"Confounding in the pilot has flattened the effects"},{"key":"C","text":"The pilot is too small for any learner to find differences"},{"key":"D","text":"Trees seldom split on coaching, so its interactions shrink"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The S-learner's regularisation treats coaching like any other feature; differences in effect need interactions with it, which shallow, regularised trees often leave out.","misconceptions":["Takes a model's output as a fact about the world","Blames confounding in a randomised pilot, where there is none","Thinks the sample is the problem; the S-learner shrinks effects at any size",""],"lo":["LO2"],"day":2,"session":1,"slide":{"deck":"day2","id":"check-meta-learners","title":"Why might the S-learner report almost no difference between seekers?"},"level":null,"pool":"checkpoint"},{"id":"check-causal-forest-q1","type":"single","prompt":"An analyst grows a causal tree on all 3,600 training seekers and estimates each leaf's effect on the same seekers that chose the splits. What goes wrong?","options":[{"key":"A","text":"Leaf effects are inflated by the noise that chose the splits"},{"key":"B","text":"The splits follow employment levels rather than effects"},{"key":"C","text":"The estimates are confounded by who was coached"},{"key":"D","text":"The fit takes twice as long as it needs to"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A split search finds the cut where the observed difference is largest, noise included; estimating on the same seekers reports that noise as effect.","misconceptions":["","Confuses honesty with residualising, which handles the outcome level","Thinks honesty is about confounding; the pilot was randomised","Believes reusing data only costs computing time"],"lo":["LO2"],"day":2,"session":2,"slide":{"deck":"day2","id":"check-causal-forest","title":"What does honesty protect against?"},"level":null,"pool":"checkpoint"},{"id":"check-validation-q1","type":"single","prompt":"On held-out randomised seekers, an estimator's predicted effects range from 5 to 14 points and its best-linear-predictor slope is 3.1 (standard error 0.6). What do you conclude?","options":[{"key":"A","text":"The estimator has no useful signal"},{"key":"B","text":"It ranks well, but real differences are about three times larger"},{"key":"C","text":"It exaggerates differences between seekers"},{"key":"D","text":"Its average effect is three times too small"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The slope scales differences around the mean: each point of predicted difference brings about three points of observed difference.","misconceptions":["Reads any slope far from 1 as failure; a steep slope still means strong signal","","Inverts the slope: below 1 would mean overconfident","Treats calibration of scale as a property of the average, not of differences"],"lo":["LO2"],"day":2,"session":3,"slide":{"deck":"day2","id":"check-validation","title":"What does a best-linear-predictor slope of 3 tell you?"},"level":null,"pool":"checkpoint"},{"id":"check-qini-q1","type":"single","prompt":"An estimator's Qini curve lies well above the random line at every share. Which claim does that support?","options":[{"key":"A","text":"Its predicted effects are correct in size"},{"key":"B","text":"It will rank next year's seekers just as well"},{"key":"C","text":"Its top seekers gain more than a random pick would"},{"key":"D","text":"No other ranking could do better at any budget"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A Qini curve measures how the ranking concentrates the effect; it says nothing about the scale of the predictions or about other rankings.","misconceptions":["Confuses ranking with calibration in scale","Treats a curve on one sample as proof for every population","","Takes a curve that dominates random for one that dominates every alternative"],"lo":["LO2"],"day":2,"session":4,"slide":{"deck":"day2","id":"check-qini","title":"What does a Qini curve check?"},"level":null,"pool":"checkpoint"},{"id":"review-day-2-q1","type":"single","prompt":"An effect model will decide next year's coaching places. Its builder shows a high correlation between predicted effects and observed outcomes on the training seekers. What do you ask for?","options":[{"key":"A","text":"Nothing more: a high correlation on 3,600 seekers is enough"},{"key":"B","text":"The correlation of its predictions with the risk score"},{"key":"C","text":"Bootstrap intervals for the same training correlation"},{"key":"D","text":"Observed effects by prediction group on held-out randomised seekers"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Effects are only observable for groups of randomised seekers, and only seekers the model never saw give an honest check.","misconceptions":["Accepts outcome prediction on seen data as evidence about effects","Checks the model's agreement with another model, not with effects","Asks for precision on the same seekers, which repeats the flaw",""],"lo":["LO2"],"day":3,"session":null,"slide":{"deck":"day3","id":"review-day-2","title":"Which check would you insist on before targeting with an effect model?"},"level":null,"pool":"checkpoint"},{"id":"check-logged-q1","type":"single","prompt":"In an agency's logs, the mean of offered divided by the recorded probability is 1.15, with a standard error of 0.02. What follows?","options":[{"key":"A","text":"Coaching raised employment by 15%"},{"key":"B","text":"More offers happened than recorded: some probabilities are too low"},{"key":"C","text":"Nothing: weights are noisy and a mean of 1.15 is normal"},{"key":"D","text":"The tool records probabilities that are too high"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"With correct probabilities, a/p averages to 1. Above 1 means offers were more frequent than recorded, so recorded p is too small somewhere.","misconceptions":["Thinks the check measures coaching's effect rather than the records","","Reads a 15% gap as sampling noise despite eight standard errors","Inverts the direction: a/p above 1 means p is too small"],"lo":["LO3"],"day":3,"session":1,"slide":{"deck":"day3","id":"check-logged","title":"What does a mean of a/p equal to 1.15 tell you?"},"level":null,"pool":"checkpoint"},{"id":"check-augmented-q1","type":"single","prompt":"You value a rule with the augmented estimator. The recorded probabilities have been checked and are right; the outcome model is poor. What happens?","options":[{"key":"A","text":"The estimate is biased, because the outcome model is wrong"},{"key":"B","text":"The estimate is right and as precise as with a good model"},{"key":"C","text":"It stays consistent, with a wider interval"},{"key":"D","text":"The estimate equals the IPW value exactly"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"With correct weights the residual term corrects any outcome model on average; a poor model leaves larger residuals, so more variance.","misconceptions":["Thinks both parts must be right; one is enough","Confuses consistency with precision: a poor model costs variance, not validity","","Assumes the augmented estimator reduces to plain IPW whatever the model"],"lo":["LO3"],"day":3,"session":2,"slide":{"deck":"day3","id":"check-augmented","title":"When is the augmented value still right?"},"level":null,"pool":"checkpoint"},{"id":"check-heavy-weights-q1","type":"single","prompt":"The \"reach the unreached\" rule has an IPW value 1.6 points below current practice, an effective sample size of 58 among the seekers it would coach, and moves by a point when weights are clipped. What do you recommend?","options":[{"key":"A","text":"Reject the rule: the logs show it adds nothing"},{"key":"B","text":"Report the value clipped at 20 as the estimate"},{"key":"C","text":"Say the logs cannot value it; propose a small pilot"},{"key":"D","text":"Report the augmented value, which does not depend on the weights"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The estimate rests on a few heavy weights and an extrapolating outcome model; only new data on these seekers can answer the question.","misconceptions":["Reads an unreliable estimate as evidence of no effect","Treats clipping as a fix rather than a sensitivity check","","Assumes an outcome model can stand in for missing data"],"lo":["LO3"],"day":3,"session":3,"slide":{"deck":"day3","id":"check-heavy-weights","title":"What do you tell the advocacy group?"},"level":null,"pool":"checkpoint"},{"id":"check-review-q1","type":"single","prompt":"A colleague wants to keep the analyst's best cell but make it credible. Which step does that?","options":[{"key":"A","text":"Report the p-value to three decimals so readers see it is 0.001"},{"key":"B","text":"Search more cells to show the finding is robust"},{"key":"C","text":"Bootstrap the cell's 36 seekers and report the interval"},{"key":"D","text":"Test the cell on seekers outside the search"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Only data not used in the search can estimate the effect of a cell without the inflation that selection added.","misconceptions":["Thinks a smaller p-value repairs selection; it was selected for being small","Adds more searching, which makes selection worse","Uses the same seekers twice in a different way",""],"lo":["LO5"],"day":3,"session":4,"slide":{"deck":"day3","id":"check-review","title":"Which fix answers the dredged cell?"},"level":null,"pool":"checkpoint"},{"id":"review-day-3-q1","type":"single","prompt":"A colleague reports a candidate rule's inverse propensity value as 61.2% employed, with a 95% interval. What else must the report show before anyone relies on it?","options":[{"key":"A","text":"Nothing: the interval already shows the uncertainty"},{"key":"B","text":"Its effective sample size, and how it moves when weights are clipped"},{"key":"C","text":"The outcome model's accuracy on the logs"},{"key":"D","text":"The rule's true value from the generator"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"An interval computed from a few heavy weights can look precise and still rest on a handful of decisions; the diagnostics show whether it does.","misconceptions":["Thinks a narrow interval rules out instability from a few weights","","Checks the outcome model, which plain IPW does not use","Uses the generator's truth, which real data never give"],"lo":["LO3"],"day":4,"session":null,"slide":{"deck":"day4","id":"review-day-3","title":"Which number do you put next to a rule's offline value?"},"level":null,"pool":"checkpoint"},{"id":"check-policy-tree-q1","type":"single","prompt":"A colleague proposes to learn the allocation tree by predicting employment within six months and offering places to the leaves with the lowest predicted employment. What is wrong?","options":[{"key":"A","text":"It targets need, not gain: it rebuilds the risk score"},{"key":"B","text":"A depth-two tree is too simple to predict employment well"},{"key":"C","text":"The pilot is too small for prediction"},{"key":"D","text":"Nothing, if the leaves are chosen on held-out data"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Leaves with low employment are where seekers struggle, not where coaching helps; the tree must sum gains, which the scores estimate.","misconceptions":["","Thinks the problem is the model class, not the target","Thinks prediction on the pilot is biased; randomisation does not change that the target is wrong","Inverts the advice: lowest employment is exactly what risk targeting picks"],"lo":["LO4"],"day":4,"session":1,"slide":{"deck":"day4","id":"check-policy-tree","title":"Why learn the tree from scores, not from outcomes?"},"level":null,"pool":"checkpoint"},{"id":"check-fairness-q1","type":"single","prompt":"A rule offers places to disabled and non-disabled seekers at the same rate. A board member calls it fair to disabled seekers. What do you add?","options":[{"key":"A","text":"Nothing: equal rates are the definition of fairness"},{"key":"B","text":"The rule should use disability to offer more places"},{"key":"C","text":"Rates show who is offered, not who gains"},{"key":"D","text":"Equal rates show the rule ignores disability, which is discrimination"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Selection rates are one view; gains by group are another. Disabled seekers truly gain 26 points per place against 21; deciding whether that justifies priority is a policy choice.","misconceptions":["Treats one metric as a full fairness assessment","Proposes using a sensitive attribute to decide without a policy decision","","Inverts the direction: unequal rates are what the audit looks for"],"lo":["LO4"],"day":4,"session":2,"slide":{"deck":"day4","id":"check-fairness","title":"What does an equal selection rate prove?"},"level":null,"pool":"checkpoint"},{"id":"check-trial-q1","type":"single","prompt":"The rule finds 20.7 jobs per 100 places against 11.4 for current practice, yet the trial needs about 18,000 seekers per arm. Why?","options":[{"key":"A","text":"The per-place gain is too small to detect"},{"key":"B","text":"The arms mostly agree, so across everyone the difference is 1.4 points"},{"key":"C","text":"The interim look doubles the sample size"},{"key":"D","text":"Offices are clustered, so the design effect inflates the sample"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The trial compares everyone in one arm with everyone in the other: a large gain for a few is a small difference for all.","misconceptions":["Thinks the sample size is driven by the per-place gain, not by the population difference","","Confuses the stopping rule's small cost with the main driver","Office clustering applies only if offices are randomised"],"lo":["LO6"],"day":4,"session":3,"slide":{"deck":"day4","id":"check-trial","title":"Why is the trial so large when the rule finds twice the jobs per place?"},"level":null,"pool":"checkpoint"},{"id":"check-summary-q1","type":"single","prompt":"You are writing the \"What it is worth\" section. Which sentence is right for it?","options":[{"key":"A","text":"The policy's doubly robust value proves a CATE-driven uplift of 1.4 points"},{"key":"B","text":"The rule will employ 58.9% of seekers"},{"key":"C","text":"The rule guarantees more jobs than current practice"},{"key":"D","text":"On past records, about 14 more per 1,000 in work than today (6 to 22)"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"It names the source, compares with current practice, counts people, and keeps the uncertainty.","misconceptions":["Uses jargon and overclaims a proven effect","States a precise number without uncertainty or comparison","Turns an offline estimate into a promise",""],"lo":["LO4"],"day":4,"session":4,"slide":{"deck":"day4","id":"check-summary","title":"Which sentence belongs on the director's page?"},"level":null,"pool":"checkpoint"},{"id":"q-estimand-01","type":"single","prompt":"Duhaim, head of caseworkers, asks: \"Did coaching raise employment for the seekers my caseworkers chose to coach last year?\" Which summary answers him?","options":[{"key":"A","text":"The effect on the seekers who were offered coaching"},{"key":"B","text":"The average effect over every registered seeker"},{"key":"C","text":"The value of the best rule under next year's budget"},{"key":"D","text":"The difference in employment between coached and uncoached seekers"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"He asks about the seekers who were offered coaching, so the estimand is the effect on the offered (ATT), not the average over everyone.","misconceptions":["","Answers for everyone, though he asked about the seekers his team chose","Answers a forward-looking decision, not a question about last year","Reads an observed difference as the effect, ignoring how caseworkers chose"],"lo":["LO1"],"day":1,"session":1,"slide":{"deck":"day1","id":"five-parts-of-an-estimand","title":"An estimand has five parts, and the method comes after all five"},"level":"apply","pool":"practice"},{"id":"q-risk-benefit-01","type":"single","prompt":"A vendor shows that Fursa's risk score predicts unemployment at six months with an AUC of 0.85 and proposes giving places to the top fifth by score. What is the main flaw?","options":[{"key":"A","text":"An AUC of 0.85 is too low for a public decision"},{"key":"B","text":"It ranks need without coaching, not what coaching changes"},{"key":"C","text":"The score was trained on old data and may have drifted"},{"key":"D","text":"Places should be given at random to be fair"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The score predicts the outcome without coaching; the places should follow the difference coaching makes, which is a different quantity.","misconceptions":["Treats the score's accuracy as the issue; a perfect score would have the same flaw","","Names a real risk, but not the one that makes the ranking wrong","Confuses fairness of process with getting the most jobs from a budget"],"lo":["LO4"],"day":1,"session":1,"slide":{"deck":"day1","id":"risk-is-not-benefit","title":"Risk is the outcome without coaching; benefit is the difference coaching makes"},"level":"analyze","pool":"practice"},{"id":"q-overlap-01","type":"single","prompt":"In the logs, disabled seekers in Nijad were offered coaching in under 1% of decisions. A colleague still reports a doubly robust effect for them. What do you say?","options":[{"key":"A","text":"The doubly robust estimator protects the estimate, so it can stand"},{"key":"B","text":"Trim them out and report the trimmed effect as the effect for all seekers"},{"key":"C","text":"It rests on the outcome model's extrapolation; say so or drop it"},{"key":"D","text":"Increase the number of folds so the group appears in every fold"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Without offered seekers like them, no weighting or matching can compare; only a model's extrapolation speaks for them.","misconceptions":["Believes double robustness repairs a lack of overlap","Trims without saying that the estimand changed","","Thinks a resampling choice can create data that were never collected"],"lo":["LO1"],"day":1,"session":2,"slide":{"deck":"day1","id":"positivity","title":"Positivity: every kind of seeker had some chance of each decision"},"level":"analyze","pool":"practice"},{"id":"q-dml-01","type":"single","prompt":"Why does double machine learning use a score with residual corrections instead of averaging the difference of two outcome-model predictions?","options":[{"key":"A","text":"The corrections speed up the fitting of gradient boosting"},{"key":"B","text":"The corrections remove the need for a propensity model"},{"key":"C","text":"The corrections make the estimate unbiased even with a hidden confounder"},{"key":"D","text":"The corrections make the estimate insensitive to small errors in the nuisance models"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The orthogonal score has zero derivative in the nuisance models at the truth, so their regularisation errors enter only to second order.","misconceptions":["Mistakes a statistical property for a computational one","Inverts the role of the corrections: they are built from the propensity model","Expects an estimator to fix information missing from the data",""],"lo":["LO1"],"day":1,"session":3,"slide":{"deck":"day1","id":"plug-in-bias","title":"Plugging machine learning predictions into an effect formula passes their bias straight through"},"level":"understand","pool":"practice"},{"id":"q-dml-02","type":"single","prompt":"On 40,000 logged decisions, regression adjustment with 60 controls gives 13.5 points (12.4 to 14.7) and DoubleML gives 10.8 (9.6 to 12.1). Without knowing the truth, which reasoning should guide the report?","options":[{"key":"A","text":"DoubleML: flexible nuisances follow nonlinear confounding"},{"key":"B","text":"Report the average of the two as a compromise"},{"key":"C","text":"Report the regression: its interval is narrower"},{"key":"D","text":"Report neither: the two disagree, so the data cannot answer"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The regression assumes linear confounding; DoubleML does not, and its interval is valid under weaker assumptions.","misconceptions":["","Averages a biased and an unbiased estimator, keeping part of the bias","Treats a narrow interval as evidence of a correct model","Takes disagreement between a restrictive and a flexible model as a sign that nothing is identified"],"lo":["LO1"],"day":1,"session":3,"slide":{"deck":"day1","id":"estimate-table","title":"Regression with 60 controls missed by three points; double machine learning did not"},"level":"evaluate","pool":"practice"},{"id":"q-sensitivity-01","type":"single","prompt":"On the 2027 extract the DoubleML estimate is 12.8 points with a robustness value of 8.5%. What may you tell the director?","options":[{"key":"A","text":"Coaching raised employment by 12.8 points, whatever is missing from the data"},{"key":"B","text":"A hidden factor explaining under 8.5% of both cannot erase it"},{"key":"C","text":"There is an 8.5% chance that the effect is zero"},{"key":"D","text":"The bias from the missing column is at most 8.5 points"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The robustness value is the confounder strength, on both partial R2 scales, that would bring the estimate to zero.","misconceptions":["Reads a point estimate as robust to hidden confounding","","Reads the robustness value as a probability","Confuses the strength of a confounder with the size of the bias"],"lo":["LO1"],"day":1,"session":4,"slide":{"deck":"day1","id":"reading-the-bound","title":"A confounder of strength 0.03 could move the estimate anywhere from 8.4 to 17.2 points"},"level":"evaluate","pool":"practice"},{"id":"q-learners-01","type":"single","prompt":"Four nuisance learners give DML estimates from 11.0 to 14.2 points. How should the learner for the report be chosen?","options":[{"key":"A","text":"By the smallest standard error"},{"key":"B","text":"By the estimate closest to what the caseworkers expect"},{"key":"C","text":"By out-of-fold nuisance losses, fixed before the estimates"},{"key":"D","text":"By the median of the four estimates"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Nuisance learners are judged by how well they predict, out of fold; choosing by the estimate invalidates the interval.","misconceptions":["Treats precision as accuracy","Lets the desired answer choose the method: a forking path","","Averages over learners known to be poor, keeping their bias"],"lo":["LO1"],"day":1,"session":4,"slide":{"deck":"day1","id":"choose-by-loss","title":"Choose nuisance learners by out-of-fold loss, before you see the estimate"},"level":"apply","pool":"practice"},{"id":"q-meta-01","type":"single","prompt":"In the X-learner on a 1:1 pilot, what is the imputed effect for a coached seeker who found work?","options":[{"key":"A","text":"1 minus the coached model's predicted chance for her"},{"key":"B","text":"The difference between the two models' predictions for her"},{"key":"C","text":"The uncoached model's predicted chance minus 1"},{"key":"D","text":"1 minus the uncoached model's predicted chance for her"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"For a coached seeker the missing outcome is the uncoached one, so the imputed effect is her observed outcome minus the uncoached model's prediction.","misconceptions":["Uses her own arm's model, which predicts her observed outcome, not her missing one","Describes the T-learner, not the imputation step","Reverses the sign used for the coached arm",""],"lo":["LO2"],"day":2,"session":1,"slide":{"deck":"day2","id":"x-learner-steps","title":"The X-learner models imputed effects, which are smoother than outcomes"},"level":"apply","pool":"practice"},{"id":"q-meta-02","type":"single","prompt":"A T-learner fitted with lightly regularised boosting on 1,800 seekers per arm predicts effects from minus 40 to plus 60 points. The true effects range from minus 10 to plus 30. What is the most likely cause?","options":[{"key":"A","text":"Each arm's model fits its own noise, which the difference adds up"},{"key":"B","text":"Confounding between the arms in the pilot"},{"key":"C","text":"The outcome is binary, so effects cannot be estimated"},{"key":"D","text":"The T-learner always shrinks effects towards zero"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Two separately fitted models subtract their errors; with weak regularisation the spread of predicted effects is mostly noise.","misconceptions":["","Blames confounding in a lottery","Treats a binary outcome as a barrier rather than a source of noise","Describes the S-learner's failure, the opposite of this one"],"lo":["LO2"],"day":2,"session":1,"slide":{"deck":"day2","id":"t-learner-noise","title":"Two separate models subtract their errors, and the difference looks like heterogeneity"},"level":"analyze","pool":"practice"},{"id":"q-forest-01","type":"single","prompt":"The causal forest ranks distance to the office as the second driver of effect variation. A manager proposes moving coaching closer to remote seekers to raise its effect. What do you say?","options":[{"key":"A","text":"Agree: the forest shows distance causes smaller effects"},{"key":"B","text":"Disagree: importance describes, a trial of the change would tell"},{"key":"C","text":"Disagree: importance near the top is always an artefact of correlated features"},{"key":"D","text":"Agree, if the forest's importance has a confidence interval above zero"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The effect of coaching is causal; how it varies with distance is a description, and moving the service is a different intervention.","misconceptions":["Reads a moderator as a lever that can be changed","","Overgeneralises a real caveat into a rule","Thinks statistical precision turns a description into a causal claim about a different intervention"],"lo":["LO2"],"day":2,"session":2,"slide":{"deck":"day2","id":"importance-is-not-cause","title":"A driver of effect variation is a description, not a lever"},"level":"evaluate","pool":"practice"},{"id":"q-validate-01","type":"single","prompt":"You want to check whether an effect model trained on the pilot's training split can be trusted. Which check is valid?","options":[{"key":"A","text":"Compare its predictions with the observed outcomes of the training seekers"},{"key":"B","text":"Compute the correlation between its predictions and the risk score"},{"key":"C","text":"Compare group effects by prediction on held-out randomised seekers"},{"key":"D","text":"Report its R-squared on the held-out outcomes"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Individual effects are never observed, but group effects on held-out randomised data are, so groups formed by the prediction can be checked.","misconceptions":["Uses outcomes, which are not effects, and seekers the model has seen","Checks agreement with another model, not with effects","","Measures outcome prediction, not effect prediction"],"lo":["LO2"],"day":2,"session":3,"slide":{"deck":"day2","id":"calibration-by-quintile","title":"Sort by prediction into five groups and compare predicted with observed effects"},"level":"apply","pool":"practice"},{"id":"q-validate-02","type":"single","prompt":"On held-out seekers, estimator A has a best-linear-predictor slope of 0.9 (se 0.2) and estimator B a slope of 0.1 (se 0.2). Both have the same mean prediction. Which conclusion holds?","options":[{"key":"A","text":"A overstates differences by 10%"},{"key":"B","text":"B is better calibrated because its slope is closer to zero"},{"key":"C","text":"Both are equally useful because their averages agree"},{"key":"D","text":"A carries real signal about effect differences; B almost none"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The slope measures how much observed differences follow predicted ones: near 1 is calibrated, near 0 is no signal.","misconceptions":["Reads a slope below 1, within one standard error, as a precise overstatement","Thinks the target slope is zero","Judges an effect model by its average, which says nothing about targeting",""],"lo":["LO2"],"day":2,"session":3,"slide":{"deck":"day2","id":"best-linear-predictor","title":"Regress an unbiased effect score on the prediction: a slope near 1 means right in scale"},"level":"evaluate","pool":"practice"},{"id":"q-qini-01","type":"single","prompt":"Why do the Qini curves of every ranking end at the same point?","options":[{"key":"A","text":"At 100% every ranking coaches everyone"},{"key":"B","text":"Because every ranking was trained on the same data"},{"key":"C","text":"Because the curves are normalised to end at 1"},{"key":"D","text":"Because random allocation is the best any ranking can do at full budget"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"At full budget the ranking no longer matters: everyone is coached.","misconceptions":["","Confuses training data with the end point of the curve","Assumes a normalisation the Qini curve does not use","Reads the shared end point as a limit on rankings"],"lo":["LO2"],"day":2,"session":4,"slide":{"deck":"day2","id":"qini-curves","title":"The Qini curve of estimated benefit stays above random; the risk score's hugs the line"},"level":"understand","pool":"practice"},{"id":"q-uplift-01","type":"single","prompt":"Switching from ranking by risk to ranking by estimated benefit would move 84% of the places to different seekers and raise the jobs found. What is the data scientist's responsibility here?","options":[{"key":"A","text":"Recommend the switch: more jobs settle the question"},{"key":"B","text":"Show who gains and loses a place, and leave priority to its owner"},{"key":"C","text":"Recommend keeping the risk score, because changing who gets support is unfair"},{"key":"D","text":"Average the two rankings to split the difference"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Who should be prioritised is a value choice; the analysis makes the trade-off visible and audited.","misconceptions":["Treats a value choice about who receives support as a technical result","","Decides the value question in the other direction without showing the trade-off","Mixes two rules without measuring what the mixture buys or costs"],"lo":["LO4"],"day":2,"session":4,"slide":{"deck":"day2","id":"places-change-hands","title":"84% of the places would go to different seekers, and about 117 more per thousand places would find work"},"level":"evaluate","pool":"practice"},{"id":"q-logs-01","type":"single","prompt":"An agency hands you 30,000 logged decisions with the probability its tool recorded for each. Before valuing any rule, what do you check first?","options":[{"key":"A","text":"That the outcome model fitted on the logs has a high AUC"},{"key":"B","text":"That the recorded probabilities lie between 0.05 and 0.95"},{"key":"C","text":"That offered divided by recorded probability averages to 1, by office"},{"key":"D","text":"That the offer rate equals the target budget"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"With correct probabilities the weights average to 1; a group where they do not is a group whose records misdescribe the decisions.","misconceptions":["Checks the outcome model, which the recorded probabilities do not depend on","Checks a range, which says nothing about whether they describe what happened","","Compares with a plan rather than with the records"],"lo":["LO3"],"day":3,"session":1,"slide":{"deck":"day3","id":"weights-average-to-one","title":"If the recorded probabilities are right, the weights a/p and (1-a)/(1-p) average to 1"},"level":"apply","pool":"practice"},{"id":"q-logs-02","type":"single","prompt":"One office overrode the allocation tool for a year while the tool kept recording its own probabilities. A candidate rule targets seekers in that office's region. What do you do?","options":[{"key":"A","text":"Use the recorded probabilities: they are the official record"},{"key":"B","text":"Drop the office and value the rule on the other offices only, without comment"},{"key":"C","text":"Clip the office's weights at 20"},{"key":"D","text":"Re-estimate that office's propensities from its covariates and say so in the report"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"When the office matters to the rule, its propensities must be modelled as on Day 1, and the report must say the records were replaced.","misconceptions":["Trusts a record the check has shown to be wrong","Drops the region the rule targets and hides the change of population","Treats wrong probabilities as a variance problem",""],"lo":["LO3"],"day":3,"session":1,"slide":{"deck":"day3","id":"exclude-or-re-estimate","title":"Exclude the office or re-estimate its propensities, and say which"},"level":"evaluate","pool":"practice"},{"id":"q-ope-01","type":"single","prompt":"In inverse propensity valuation of a rule, a seeker whom the logs did not coach but the rule would coach contributes what?","options":[{"key":"A","text":"Nothing: the logs did not do what the rule would do"},{"key":"B","text":"Her outcome, weighted by one over the probability of coaching"},{"key":"C","text":"Her outcome plus the average effect of coaching"},{"key":"D","text":"Her outcome with weight one"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Only decisions where the logs agree with the rule show the outcome the rule would produce; the weights let them stand in for the rest.","misconceptions":["","Uses an outcome observed without coaching as if it were under coaching","Imputes an effect the plain IPW estimator never imputes","Forgets that disagreeing decisions are dropped"],"lo":["LO3"],"day":3,"session":2,"slide":{"deck":"day3","id":"ipw-value","title":"Keep the decisions the rule agrees with, and weight each by one over its probability"},"level":"understand","pool":"practice"},{"id":"q-ope-02","type":"single","prompt":"You value three rules with inverse propensity weighting and with the augmented estimator. The augmented intervals are all narrower. Why?","options":[{"key":"A","text":"The augmented estimator uses more data"},{"key":"B","text":"The weighted residuals vary less than the weighted outcomes"},{"key":"C","text":"The augmented estimator clips the weights"},{"key":"D","text":"The augmented estimator assumes no confounding and IPW does not"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Weighting residuals rather than raw outcomes shrinks the variance, while the correction keeps the estimate consistent.","misconceptions":["Both use the same decisions","","Confuses augmentation with clipping","Both rely on the same identification; the difference is variance"],"lo":["LO3"],"day":3,"session":2,"slide":{"deck":"day3","id":"snipw-and-augmented","title":"Self-normalising tames the weights; augmenting adds an outcome model and keeps the estimate honest"},"level":"analyze","pool":"practice"},{"id":"q-ope-03","type":"single","prompt":"Two rules have the same estimated value, within 0.1 points: a caseworker rule on months unemployed and a top fifth ranked by a causal forest. Which choice is best defended?","options":[{"key":"A","text":"The forest: a model that uses more information must be better"},{"key":"B","text":"Either, chosen by coin toss, since they are equal"},{"key":"C","text":"The readable rule, unless a paired interval favours the other"},{"key":"D","text":"Neither, until a larger dataset separates them"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"When the values tie, transparency, auditability and ease of use decide; a paired interval for the difference checks the tie.","misconceptions":["Ignores that the table shows no difference in value","Ignores what else separates them","","Delays a decision that the table already supports"],"lo":["LO4"],"day":3,"session":2,"slide":{"deck":"day3","id":"value-table","title":"Benefit and duration both beat current practice by over two points; risk targeting does not"},"level":"evaluate","pool":"practice"},{"id":"q-ess-01","type":"single","prompt":"A rule would coach 3,000 seekers. The logs coached 130 of them, and their weights have an effective sample size of 60. What does this mean for the value estimate?","options":[{"key":"A","text":"It is fine if the logs hold 40,000 decisions in total"},{"key":"B","text":"It is fine, because 130 coached seekers is above the usual minimum of 30"},{"key":"C","text":"It is biased downwards by a factor of 60 over 3,000"},{"key":"D","text":"It rests on the equivalent of about 60 decisions, so it can move a lot with a few of them"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Kish's effective sample size tells how many equally weighted decisions carry the estimate; 60 cannot speak reliably for 3,000.","misconceptions":["Looks at the whole file, not at the seekers the rule changes","Counts decisions without regard to how unequal their weights are","Treats the effective sample size as a bias correction",""],"lo":["LO3"],"day":3,"session":3,"slide":{"deck":"day3","id":"effective-sample-size","title":"2,922 seekers to coach, 126 coached in the logs, worth 58 decisions"},"level":"apply","pool":"practice"},{"id":"q-ess-02","type":"single","prompt":"Clipping the weights at 20 moves a rule's value from 55.9% to 54.8%; the next best rule differs by 0.8 points. What do you report?","options":[{"key":"A","text":"That the logs cannot rank it, with both values and the ESS"},{"key":"B","text":"The unclipped value, since clipping adds bias"},{"key":"C","text":"The average of the two"},{"key":"D","text":"The clipped value, since clipping reduces variance"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"When the sensitivity to a few weights exceeds the gap between rules, the honest report is that the data cannot decide.","misconceptions":["","Hides a sensitivity that is larger than the decision margin","Invents an estimator with no justification","Treats a biased fix as the estimate"],"lo":["LO3"],"day":3,"session":3,"slide":{"deck":"day3","id":"clipping-moves-the-answer","title":"Clipping the weights moves the value by a point, which is the size of the differences between rules"},"level":"evaluate","pool":"practice"},{"id":"q-review-01","type":"single","prompt":"An analyst reports that seekers who attended four or more coaching sessions gained 27 points. Which flaw matters most?","options":[{"key":"A","text":"The subgroup is too small"},{"key":"B","text":"It is defined after the lottery, so it is selected"},{"key":"C","text":"The p-value should be corrected for multiple tests"},{"key":"D","text":"The analyst should have used a causal forest"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Attendance exists only for coached seekers and depends on traits like motivation; the comparison mixes coaching with selection.","misconceptions":["Over 1,500 seekers: size is not the problem","","One pre-chosen comparison; the flaw is in its design","A different estimator cannot fix a subgroup defined after treatment"],"lo":["LO5"],"day":3,"session":4,"slide":{"deck":"day3","id":"post-treatment-subgroup","title":"A subgroup defined after the lottery is selected, not randomised"},"level":"analyze","pool":"practice"},{"id":"q-review-02","type":"single","prompt":"A memo picks the largest of 60 subgroup effects, 49.5 points in 36 seekers, estimated on the same data used to search. What is your best estimate of its true effect without new data?","options":[{"key":"A","text":"49.5 points, since the p-value is 0.001"},{"key":"B","text":"Zero, because dredged findings are always false"},{"key":"C","text":"Much smaller: noise helped it win the search"},{"key":"D","text":"Exactly the average effect, since all cells are equal"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Selection inflates the largest estimate; honest searches show winners shrinking by about half on fresh seekers.","misconceptions":["Ignores that the cell was chosen for being large","Overcorrects: the cell may still benefit","","Assumes no real heterogeneity"],"lo":["LO5"],"day":3,"session":4,"slide":{"deck":"day3","id":"dredged-cell","title":"The largest of 60 cells is mostly the noise that made it the largest"},"level":"evaluate","pool":"practice"},{"id":"q-review-03","type":"single","prompt":"Of 60 cells, 52 have p above 0.05. The memo says coaching \"showed no effect\" in them. What is wrong?","options":[{"key":"A","text":"Nothing: p above 0.05 means no effect"},{"key":"B","text":"Those cells should be merged into one and tested again"},{"key":"C","text":"The threshold should have been 0.10"},{"key":"D","text":"Cells this small rarely detect a real 10-point effect"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A non-significant small cell is uninformative; its interval includes both no effect and the average effect.","misconceptions":["Reads absence of significance as evidence of absence","A remedy, not a diagnosis of what the memo got wrong","Moves the threshold instead of reading the uncertainty",""],"lo":["LO5"],"day":3,"session":4,"slide":{"deck":"day3","id":"many-cells","title":"Eight significant cells out of sixty do not pick out the targets, and silence is not absence"},"level":"analyze","pool":"practice"},{"id":"q-tree-01","type":"single","prompt":"Without a cost per place, an exhaustive depth-two tree offers coaching to 55% of seekers; the budget allows 20%. What do you change?","options":[{"key":"A","text":"Raise the cost per place until it offers at most 20%"},{"key":"B","text":"Prune the tree to depth one"},{"key":"C","text":"Keep the tree and offer places to the first 20% who register"},{"key":"D","text":"Lower the threshold of every split by 20%"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A cost per place is the budget in Lagrangian form: only leaves whose summed gain beats it are offered.","misconceptions":["","Changes the shape of the rule, not how many it offers","Replaces the learned rule with arrival order","Treats thresholds as a budget dial, with no link to gains"],"lo":["LO4"],"day":4,"session":1,"slide":{"deck":"day4","id":"budget-as-a-cost","title":"A budget becomes a cost per place: raise it until the tree offers at most 20%"},"level":"apply","pool":"practice"},{"id":"q-tree-02","type":"single","prompt":"Treat-all has the highest value on the logs, 65.0% employed against the rule's 58.9%. A board member asks why not recommend it. What is the best answer?","options":[{"key":"A","text":"Treat-all is biased on the logs"},{"key":"B","text":"It needs five times the places; per place it does worse"},{"key":"C","text":"Treat-all harms some seekers"},{"key":"D","text":"Treat-all cannot be audited by region"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"With one place per five seekers, the comparison that matters is jobs per place within the budget.","misconceptions":["Its estimate is fine; the issue is cost","","A real concern in general, but not why it loses here","Every rule can be audited; treat-all offers every region the same"],"lo":["LO4"],"day":4,"session":1,"slide":{"deck":"day4","id":"rule-against-alternatives","title":"The rule finds about twice as many jobs per place as current practice"},"level":"evaluate","pool":"practice"},{"id":"q-fair-01","type":"single","prompt":"An agency stores each seeker's number of dependants, collected to calculate family benefits. A colleague wants the coaching rule to use it. Which role fits best, and why?","options":[{"key":"A","text":"Drive: it predicts who benefits"},{"key":"B","text":"Audit: every result should be checked by number of dependants"},{"key":"C","text":"Exclude: collected for another purpose"},{"key":"D","text":"Drive, as long as it is transformed into a score"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Purpose limitation applies to the use of data, whatever the model gains from it; the register records the decision and its reason.","misconceptions":["Puts predictive value above the purpose the data were collected for","Possible, but does not answer whether it may decide","","Thinks a transformation changes what the data are used for"],"lo":["LO4"],"day":4,"session":2,"slide":{"deck":"day4","id":"attribute-register","title":"Every attribute gets a role: drive the rule, only audit it, or stay out"},"level":"apply","pool":"practice"},{"id":"q-fair-02","type":"single","prompt":"A benefit ranking never uses region, yet offers one remote region 7% of its seekers against 23% in another. What explains this?","options":[{"key":"A","text":"A coding error, since region was not in the model"},{"key":"B","text":"The region was over-represented in the pilot"},{"key":"C","text":"Random noise in the forest"},{"key":"D","text":"Attributes that differ by region act as proxies"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Leaving an attribute out does not remove its influence: correlated attributes act as proxies, which only an audit reveals.","misconceptions":["Assumes an attribute left out cannot be reached","Representation affects precision, not this systematic gap","A gap of this size across thousands of seekers is not noise",""],"lo":["LO4"],"day":4,"session":2,"slide":{"deck":"day4","id":"proxies","title":"The ranking reached Nijad through months unemployed and distance"},"level":"analyze","pool":"practice"},{"id":"q-fair-03","type":"single","prompt":"A regional floor changes the rule's value by -0.2 points, with a paired 95% interval from -0.5 to 0.1. How do you report it?","options":[{"key":"A","text":"Its cost is not distinguishable from zero"},{"key":"B","text":"The floor costs 0.2 points"},{"key":"C","text":"The floor is free"},{"key":"D","text":"The floor improves the rule"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The interval is the finding: the decision owner sees the range of what the constraint may cost.","misconceptions":["","Reports the point estimate as if it were certain","Reads an interval that includes zero as proof of zero","Reads a negative price as a gain without its uncertainty"],"lo":["LO4"],"day":4,"session":2,"slide":{"deck":"day4","id":"regional-floor","title":"A regional floor costs nothing measurable here: report it as an interval, not as free"},"level":"evaluate","pool":"practice"},{"id":"q-trial-01","type":"single","prompt":"A rule and current practice disagree on 25% of seekers, and among them the rule is expected to raise employment by 6 points. What difference must a trial randomising all seekers detect?","options":[{"key":"A","text":"6 points"},{"key":"B","text":"About 1.5 points"},{"key":"C","text":"24 points"},{"key":"D","text":"It cannot be computed without the trial"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Seekers on whom the policies agree contribute no difference, so the difference across everyone is 0.25 times 6.","misconceptions":["Ignores the seekers on whom the two policies agree","","Divides instead of multiplying by the share","The expected difference is what sizing needs, and it can be computed"],"lo":["LO6"],"day":4,"session":3,"slide":{"deck":"day4","id":"where-policies-disagree","title":"The two policies disagree on a quarter of seekers: only they can show a difference"},"level":"apply","pool":"practice"},{"id":"q-trial-02","type":"single","prompt":"An agency has 12 offices and wants to randomise whole offices so caseworkers never mix the two policies. Employment rates differ between offices (ICC about 0.04). What do you advise?","options":[{"key":"A","text":"Randomise offices: mixing is the bigger risk"},{"key":"B","text":"Randomise offices, and add more seekers to compensate"},{"key":"C","text":"Randomise seekers within offices and check compliance"},{"key":"D","text":"Skip randomisation and compare offices before and after"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"With a design effect above 100, office randomisation cannot detect the difference; seeker randomisation with a compliance check can.","misconceptions":["Ignores that 11 clusters cannot power a 1.4-point difference","More seekers per office barely helps when there are only 11 clusters","","Gives up the comparison the trial exists for"],"lo":["LO6"],"day":4,"session":3,"slide":{"deck":"day4","id":"randomisation-unit","title":"Randomising Fursa's 12 offices would multiply the sample by 109"},"level":"evaluate","pool":"practice"},{"id":"q-trial-03","type":"single","prompt":"Why does a trial with one interim look use O'Brien–Fleming boundaries instead of testing at 1.96 both times?","options":[{"key":"A","text":"Regulators require exactly two looks"},{"key":"B","text":"O'Brien–Fleming boundaries make the trial smaller"},{"key":"C","text":"The interim data are less accurate"},{"key":"D","text":"Two tests at 1.96 push false positives above 5%"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Two looks give two chances to cross by luck; strict early boundaries keep the overall false-positive rate at 5%.","misconceptions":["Confuses a design choice with a rule","The boundaries slightly increase, not decrease, the sample","The data are the same kind; the issue is repeated testing",""],"lo":["LO6"],"day":4,"session":3,"slide":{"deck":"day4","id":"stopping-rule","title":"O'Brien–Fleming boundaries spend almost nothing at the halfway look"},"level":"understand","pool":"practice"},{"id":"q-trial-04","type":"single","prompt":"A seeker-level trial finds the rule raises employment by 1.5 points. A labour economist says the true gain to the region could be smaller. Why?","options":[{"key":"A","text":"Coached seekers may take jobs others would have found"},{"key":"B","text":"Seekers in the rule arm may have been more motivated"},{"key":"C","text":"The trial used intention to treat"},{"key":"D","text":"The interim look biased the estimate"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Displacement moves jobs between seekers in the same market; measuring it needs randomisation at the level of labour markets.","misconceptions":["","Randomisation balances motivation between arms","Intention to treat makes the estimate conservative for compliance, not for displacement","A pre-planned boundary keeps the test valid"],"lo":["LO6"],"day":4,"session":3,"slide":{"deck":"day4","id":"randomisation-unit","title":"Randomising Fursa's 12 offices would multiply the sample by 109"},"level":"analyze","pool":"practice"},{"id":"q-summary-01","type":"single","prompt":"A rule offers places to seekers unemployed 11 to 15 months. Which group should go to caseworker review first?","options":[{"key":"A","text":"Seekers unemployed 13 months"},{"key":"B","text":"Seekers at 10 or 16 months, and doubtful records"},{"key":"C","text":"All seekers the rule offers"},{"key":"D","text":"Seekers with the highest risk scores"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Review belongs where the rule is arbitrary (at thresholds) or blind (data it cannot see or trust).","misconceptions":["In the middle of the band, where the rule is most clearly right","","Reviewing everything removes the point of a rule","Brings back risk targeting through review"],"lo":["LO4"],"day":4,"session":4,"slide":{"deck":"day4","id":"edge-cases","title":"A rule with thresholds needs human review where it is blind or arbitrary"},"level":"apply","pool":"practice"}]}</script>
